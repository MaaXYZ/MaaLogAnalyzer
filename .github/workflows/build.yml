name: 自动构建和发布

on:
  push:
    tags:
      - 'v*' # 推送 tag 时触发，如 v1.0.0
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

jobs:
  # 构建 Windows 版本
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: 更新版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ver = $env:GITHUB_REF_NAME.Substring(1)
          Write-Host "Setting version to $ver"
          pnpm run version -- $ver

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建应用
        run: pnpm tauri build

      - name: 检查构建产物
        run: |
          if (!(Test-Path "src-tauri/target/release/bundle")) {
            Write-Host "构建产物目录不存在"
            exit 1
          }
          Write-Host "构建产物目录存在，列出内容："
          Get-ChildItem "src-tauri/target/release/bundle" -File | Select-Object -First 10 | ForEach-Object { $_.FullName }

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64-artifacts
          path: src-tauri/target/release/bundle/

  # 构建 macOS 版本
  build-macos:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel # Intel-based macOS runner
          - arch: aarch64
            runner: macos-latest # Apple Silicon macOS runner
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: 更新版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "Setting version to ${ver}"
          pnpm run version -- "${ver}"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建应用
        run: pnpm tauri build

      - name: 检查构建产物
        run: |
          if [ ! -d "src-tauri/target/release/bundle" ]; then
            echo "构建产物目录不存在"
            exit 1
          fi
          echo "构建产物目录存在，列出内容："
          find src-tauri/target/release/bundle -type f | head -10

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: src-tauri/target/release/bundle/

  # 构建 Linux 版本
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: 更新版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "Setting version to ${ver}"
          pnpm run version -- "${ver}"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
          sudo apt-get install -y fuse libfuse2 wget file

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建应用
        run: pnpm tauri build

      - name: 检查构建产物
        run: |
          if [ ! -d "src-tauri/target/release/bundle" ]; then
            echo "构建产物目录不存在"
            exit 1
          fi
          echo "构建产物目录存在，列出内容："
          find src-tauri/target/release/bundle -type f | head -10

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x86_64-artifacts
          path: src-tauri/target/release/bundle/

  # 生成 changelog
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  # 创建 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: 验证并整理发布产物
        run: node scripts/prepare-release-assets.mjs artifacts release-assets

      - name: 显示发布文件
        run: find release-assets/ -maxdepth 1 -type f -print

      - name: 创建 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'MaaLogAnalyzer-${{ github.ref_name }}'
          body: |
            ## 📦 下载说明

            ### Web
            - 在线使用: [mla.maafw.com](https://mla.maafw.com)

            ### VSCode 插件
            - Visual Studio Marketplace: [Windsland52.maa-log-analyzer](https://marketplace.visualstudio.com/items?itemName=Windsland52.maa-log-analyzer)

            ### 桌面端安装包
            - Windows (.msi)、macOS (.dmg) 与 Linux (.deb) 安装包见本页附件
            - Windows 与 macOS 安装包未进行代码签名，系统可能显示安全提示
            - 可使用附件中的 SHA256SUMS 校验下载完整性

            ## 📝 更新内容
            ${{ needs.changelog.outputs.release_body }}

            ---

            构建于: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
