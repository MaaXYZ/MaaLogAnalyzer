# Configuration for git-cliff (https://git-cliff.org/)
#
# 本配置是【草稿生成器】：git-cliff 输出的是未精炼的草稿（CHANGELOG.draft.md），
# 正式 CHANGELOG.md 由人工精炼后维护，不要用 git-cliff 覆盖正式文件。
#
# 生成草稿：pnpm run changelog:draft
# 预览未发布提交：pnpm run changelog:draft:unreleased
#
# 参考：https://git-cliff.org/docs/configuration
# 注意：不配置 [remote.github]，模板中链接写死仓库地址，
# 避免本地无 GITHUB_TOKEN 时 git-cliff 调用 GitHub API 失败。

[changelog]
header = """
# Changelog

（这是 git-cliff 自动生成的草稿，请人工合并同类项并改为用户视角后
写入正式的 CHANGELOG.md。）

"""

body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}- {% if commit.scope %}({{ commit.scope }}) {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} **BREAKING CHANGE**{% endif %}
{% endfor %}{% endfor %}

{% if previous.version %}[{{ version | trim_start_matches(pat="v") }}]: https://github.com/MaaXYZ/MaaLogAnalyzer/compare/{{ previous.version }}...{{ version }}{% endif %}
"""

removed = """
## [{{ version | trim_start_matches(pat="v") }}]
"""

trim = true
footer = """

<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "新增功能" },
  { message = "^fix", group = "修复问题" },
  { message = "^perf", group = "性能优化" },
  { message = "^refactor", group = "代码重构" },
  { message = "^docs", group = "文档更新" },
  { message = "^test", group = "测试改进" },
  { message = "^ci", group = "持续集成" },
  { message = "^build", group = "构建相关" },
  { message = "^style", group = "样式调整" },
  { message = "^chore\\(release\\)", group = "发布", skip = true },
  { message = "^chore", group = "杂项" },
  { message = "^revert", group = "回滚操作", skip = true },
  { message = "^save", group = "杂项" },
  { message = ".*", group = "其他" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
